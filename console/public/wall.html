<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The fleet wall: organism / metrics / flow. Ported from the original
     claude.ai artifact; reads /api/c/<company>/snapshot every 30 s.
     Open as /wall.html?c=<company>. Keys: 1/2/3 or arrows switch screens,
     R cycles rotation (off/30/60/120 s), remembered per tab. -->
<title>Fleet wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* A shop wall, running around the clock, read from across the room.
   Committed single-theme on purpose: a display that sits on for days must never
   flash white, so every colour is painted explicitly rather than inherited. */
:root{
  --void:#05070a; --panel:#0b1016; --panel-2:#0e141c; --line:#18222e;
  --text:#dfe8f2; --dim:#6b7e93; --dimmer:#3d4c5c;
  --live:#2ee6a8; --warn:#ffb020; --crit:#ff4d6d; --idle:#4a5a6b;
  --rail:56px;
  --gut:clamp(16px,2vw,32px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--text);
  font-family:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::after{ /* vignette — keeps the eye centred on a big panel */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- top rail ---------------------------------------------------------- */
#rail{
  position:fixed; top:0; left:0; right:0; height:var(--rail); z-index:10;
  display:flex; align-items:center; gap:var(--gut);
  padding:0 var(--gut); padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(5,7,10,.96),rgba(5,7,10,.72));
  border-bottom:1px solid var(--line);
}
#mark{display:flex;align-items:baseline;gap:10px;flex:none}
#mark b{font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
#mark span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#tabs{display:flex;gap:4px;flex:none}
#tabs button{
  appearance:none;background:transparent;border:1px solid transparent;color:var(--dim);
  font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  padding:7px 13px;border-radius:3px;cursor:pointer;
}
#tabs button:hover{color:var(--text);border-color:var(--line)}
#tabs button[aria-current="true"]{color:var(--void);background:var(--text);font-weight:600}
#tabs button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
#railend{margin-left:auto;display:flex;align-items:center;gap:var(--gut);flex:none}
#clock{font-size:18px;letter-spacing:.06em}
#rot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:"IBM Plex Mono",monospace}
#conn{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex:none}
#dot.ok{background:var(--live);box-shadow:0 0 10px var(--live)}
#dot.bad{background:var(--crit);box-shadow:0 0 10px var(--crit)}
#dot.wait{background:var(--warn)}

/* ---- screens ----------------------------------------------------------- */
.screen{position:fixed;inset:var(--rail) 0 0 0;display:none}
.screen[data-on="1"]{display:block}
#s-organism{inset:0}                      /* canvas runs under the rail */

/* notices ---------------------------------------------------------------- */
#notice{
  position:fixed;left:var(--gut);right:var(--gut);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:20;display:none;gap:14px;align-items:flex-start;
  padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--panel);border-radius:4px;
}
#notice[data-on="1"]{display:flex}
#notice h4{margin:0 0 3px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
#notice p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
#notice.crit{border-left-color:var(--crit)} #notice.crit h4{color:var(--crit)}
#ndetail{display:none;margin:9px 0 0;padding:9px 11px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.55;
  color:#8fa6bd;white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}

/* ---- organism ---------------------------------------------------------- */
#cv{display:block;width:100%;height:100%}
#legend{
  position:fixed;left:var(--gut);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:8;
  display:flex;gap:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
#roster{
  position:fixed;right:var(--gut);top:calc(var(--rail) + 20px);z-index:8;width:min(272px,26vw);
  display:flex;flex-direction:column;gap:9px;
}
.rdiv{border:1px solid var(--line);background:rgba(11,16,22,.82);border-radius:4px;padding:10px 12px}
.rdiv h5{margin:0 0 7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.rdiv h5 i{width:7px;height:7px;border-radius:50%;flex:none}
.rdiv h5 em{margin-left:auto;font-style:normal;color:var(--dim);font-size:10px}
.rrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;color:var(--dim)}
.rrow b{font-weight:500;color:var(--text)}
.rrow.vacant b{color:var(--dimmer);font-weight:400}
.rrow i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--idle)}
.rrow i.live{background:var(--live);box-shadow:0 0 7px var(--live)}
.rrow i.warn{background:var(--warn)} .rrow i.crit{background:var(--crit)}
.rrow i.vacant{background:transparent;border:1px solid var(--dimmer)}
/* the manager heads its own department */
.rrow.mgr{padding-bottom:5px;margin-bottom:3px;border-bottom:1px solid var(--line)}
.rrow.mgr b{font-weight:600}
/* model tier — what this seat costs to run, readable at a glance */
.rrow u{margin-left:auto;text-decoration:none;flex:none;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:2px;
  border:1px solid var(--line);color:var(--dimmer)}
.rrow u.t-opus{color:#c4b5fd;border-color:#3b3357}
.rrow u.t-sonnet{color:#93c5fd;border-color:#27405e}
.rrow u.t-haiku{color:#6ee7b7;border-color:#1f4a3c}
.rrow u.t-fable{color:#fbbf9a;border-color:#4a3428}

/* ---- metrics ----------------------------------------------------------- */
.pad{height:100%;overflow:auto;padding:var(--gut);padding-bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:18px 20px}
.tile k{display:block;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.tile v{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
        font-size:clamp(34px,4.4vw,58px);line-height:.95;font-weight:500}
.tile s{display:block;text-decoration:none;font-size:12px;color:var(--dim);margin-top:9px}
.tile.live v{color:var(--live)} .tile.warn v{color:var(--warn)} .tile.crit v{color:var(--crit)}
h3.sec{margin:30px 0 14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
       display:flex;align-items:center;gap:14px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:18px 20px}
#chart{width:100%;height:230px;display:block}
.dbar{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13px}
.dbar em{font-style:normal;flex:none;width:min(136px,30%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .track{flex:1;height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.dbar .fill{height:100%;border-radius:5px}
.dbar .n{flex:none;width:76px;text-align:right;color:var(--dim)}

/* ---- flow -------------------------------------------------------------- */
.three{height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,.9fr);
       gap:16px;padding:var(--gut);padding-bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px))}
@media (max-width:1100px){.three{grid-template-columns:1fr;overflow:auto}}
.col{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);
     background:var(--panel);border-radius:4px;overflow:hidden}
.col > header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
     font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);flex:none}
.col > header b{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--text);font-weight:500}
.colbody{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.empty{color:var(--dimmer);font-size:13px;padding:22px 2px;line-height:1.6}

.gate{border:1px solid var(--line);border-left:3px solid var(--dimmer);border-radius:3px;
      background:var(--panel-2);padding:11px 13px}
.gate.staged{border-left-color:var(--dim)}
.gate.team_approved{border-left-color:var(--live)}
.gate.escalated{border-left-color:var(--warn)}
.gate b{display:block;font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.3}
.gate .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--dim);
            font-family:"IBM Plex Mono",monospace}
.gate .meta span{border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.gate.high{border-left-color:var(--crit)}

.ev{display:grid;grid-template-columns:62px 9px 1fr;gap:10px;align-items:baseline;font-size:13px;line-height:1.45}
.ev time{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dimmer)}
.ev i{width:7px;height:7px;border-radius:50%;background:var(--idle);transform:translateY(-1px)}
.ev i.start{background:var(--live)} .ev i.finish{background:var(--dim)}
.ev i.flag{background:var(--crit);box-shadow:0 0 8px var(--crit)}
.ev i.warn{background:var(--warn)}
.ev .who{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ev.new{animation:slidein .45s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.flagitem{border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:3px;
          background:var(--panel-2);padding:11px 13px;font-size:13px;line-height:1.45}
.flagitem time{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dimmer);margin-top:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="rail">
  <div id="mark"><b id="cname">Fleet</b><span id="sub">— connecting</span></div>
  <nav id="tabs" aria-label="Screens"></nav>
  <div id="railend"><a id="back" href="#" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none">Console</a>
    <span id="rot"></span>
    <div id="conn"><span id="dot"></span><span id="connlabel">connecting</span></div>
    <div id="clock" class="num">--:--</div>
  </div>
</div>

<section class="screen" id="s-organism" data-on="1">
  <canvas id="cv"></canvas>
  <div id="legend">
    <span><i style="background:var(--live);box-shadow:0 0 8px var(--live)"></i>Running</span>
    <span><i style="background:var(--idle)"></i>Idle</span>
    <span><i style="background:var(--warn)"></i>Flagged</span>
    <span><i style="background:var(--crit)"></i>Failed</span>
    <span><i style="border:1px solid var(--dimmer)"></i>Seat unfilled</span>
  </div>
  <div id="roster"></div>
</section>

<section class="screen" id="s-metrics">
  <div class="pad">
    <div class="tiles" id="tiles"></div>
    <h3 class="sec">Runs, last 14 days</h3>
    <div class="two">
      <div class="card"><canvas id="chart"></canvas></div>
      <div class="card"><div id="divbars"></div></div>
    </div>
  </div>
</section>

<section class="screen" id="s-flow">
  <div class="three">
    <div class="col">
      <header>At the gates <b id="ngates">0</b></header>
      <div class="colbody" id="gates"></div>
    </div>
    <div class="col">
      <header>Live stream <b id="nflow">0</b></header>
      <div class="colbody" id="flow"></div>
    </div>
    <div class="col">
      <header>Flagged <b id="nflags">0</b></header>
      <div class="colbody" id="flags"></div>
    </div>
  </div>
</section>

<div id="notice"><div><h4 id="ntitle"></h4><p id="nbody"></p><pre id="ndetail"></pre></div></div>

<script>
"use strict";

/* ===================================================================== */
/* Configuration                                                          */
/* ===================================================================== */

var COMPANY = new URLSearchParams(location.search).get("c") || "";
var SNAPSHOT_URL = "/api/c/" + encodeURIComponent(COMPANY) + "/snapshot";
var POLL_MS = 30000;

var SCREENS = [
  {id:"organism", label:"Organism"},
  {id:"metrics",  label:"Metrics"},
  {id:"flow",     label:"Flow"}
];

/* Picking a screen, in a viewer that does not hand the page its own query
   string. Storage does the work instead, and sessionStorage is the important
   half: it is per TAB, so three monitors each remember what they were set to
   and keep it across a reload without fighting each other. localStorage is
   only the default for a tab that has never been set. */
var KEY = "fleetwall.screen." + COMPANY, KEY_ROT = "fleetwall.rotate." + COMPANY;
var IDS = SCREENS.map(function(s){ return s.id; });

function store(area, k, v){ try { window[area].setItem(k, v); } catch (e) {} }
function fetchv(area, k){ try { return window[area].getItem(k); } catch (e) { return null; } }

var params = new URLSearchParams(location.search);
var hashp = new URLSearchParams((location.hash || "").replace(/^#/, ""));

var current = params.get("screen") || hashp.get("screen") ||
              fetchv("sessionStorage", KEY) || fetchv("localStorage", KEY);
if (IDS.indexOf(current) < 0) current = "organism";

var rotateSec = parseInt(
  params.get("rotate") || hashp.get("rotate") ||
  fetchv("sessionStorage", KEY_ROT) || fetchv("localStorage", KEY_ROT) || "0", 10);
if (isNaN(rotateSec)) rotateSec = 0;

var state = { data:null, at:0, err:null, seen:{} };

/* ===================================================================== */
/* Small helpers                                                          */
/* ===================================================================== */

function $(id){ return document.getElementById(id); }
function el(tag, cls){ var n = document.createElement(tag); if (cls) n.className = cls; return n; }
function txt(n, s){ n.textContent = s == null ? "" : String(s); return n; }
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function num(v){ return (v == null || isNaN(v)) ? 0 : Number(v); }

function fmtInt(v){ return num(v).toLocaleString(); }

function hhmm(d){
  var h = d.getHours(), m = d.getMinutes();
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
function clockTick(){ $("clock").textContent = hhmm(new Date()); }

function ago(iso){
  if (!iso) return "";
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  return Math.floor(s/86400) + "d";
}
function dur(sec){
  sec = num(sec);
  if (!sec) return "—";
  if (sec < 60) return Math.round(sec) + "s";
  if (sec < 3600) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}

/* The connector wraps its JSON answer in a labelled block of prose, so the
   payload is a string with an array inside it rather than the array itself.
   Tolerant on purpose: shapes differ across shells and this must not be the
   thing that blanks the wall. */
function rowsOf(payload){
  if (payload == null) return [];
  if (Array.isArray(payload)) return payload;

  var s = null;
  if (typeof payload === "string") s = payload;
  else if (typeof payload === "object") {
    if (Array.isArray(payload.rows)) return payload.rows;
    if (typeof payload.result === "string") s = payload.result;
    else if (Array.isArray(payload.result)) return payload.result;
    else if (Array.isArray(payload.content)) {
      for (var i = 0; i < payload.content.length; i++) {
        var b = payload.content[i];
        if (b && b.type === "text" && typeof b.text === "string") { s = b.text; break; }
      }
    }
  }
  if (typeof s !== "string") return [];

  var m = s.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  var body = m ? m[1] : s;
  try { var p = JSON.parse(body); return Array.isArray(p) ? p : [p]; } catch (e) {}

  var a = body.indexOf("["), z = body.lastIndexOf("]");
  if (a >= 0 && z > a) { try { return JSON.parse(body.slice(a, z + 1)); } catch (e2) {} }
  return [];
}

/* ===================================================================== */
/* Connection state + failure design                                      */
/* Each code gets the one sentence that names the fix. A single generic    */
/* banner would hide the only action that unsticks the page.              */
/* ===================================================================== */

function setConn(kind, label){
  var d = $("dot");
  d.className = kind === "ok" ? "ok" : kind === "bad" ? "bad" : kind === "wait" ? "wait" : "";
  $("connlabel").textContent = label;
}

function notice(title, body, crit, detail){
  var n = $("notice");
  n.className = crit ? "crit" : "";
  $("ntitle").textContent = title;
  $("nbody").textContent = body;
  var d = $("ndetail");
  if (detail){ d.textContent = detail; d.style.display = "block"; }
  else { d.textContent = ""; d.style.display = "none"; }
  n.setAttribute("data-on", "1");
}
function clearNotice(){ $("notice").setAttribute("data-on", "0"); }



/* ===================================================================== */
/* Data                                                                   */
/* ===================================================================== */

function applyError(err){
  var msg = (err && err.message) ? String(err.message) : String(err || "unknown");
  state.err = msg;
  setConn("bad", "no reading");
  notice("Could not read the ledger",
    "The console's snapshot route did not answer. Showing the last good reading and trying again shortly.",
    !state.data, msg);
}

function load(){
  if (!state.data) setConn("wait", "reading");
  fetch(SNAPSHOT_URL, { cache: "no-store", credentials: "same-origin" })
    .then(function(res){
      if (res.status === 401) { location.reload(); return null; }
      return res.json().then(function(j){
        if (!res.ok || !j || j.error) throw new Error((j && j.error) || ("HTTP " + res.status));
        return j;
      });
    })
    .then(function(snap){
      if (!snap) return;
      state.data = snap;
      state.at = Date.now();
      state.err = null;
      clearNotice();
      setConn("ok", snap.paused ? "paused" : "live");
      var nm = $("cname"); if (nm && snap.company) nm.textContent = snap.company;
      document.title = (snap.company || "Fleet") + " wall";
      renderAll();
    })
    .catch(applyError);
}

/* ===================================================================== */
/* Screen: organism                                                       */
/* The fleet as a body — a nucleus, division cells around it, agents on    */
/* each membrane. Filled and pulsing means staffed; a hollow ring is a     */
/* seat nobody has built yet, which is most of the chart today.            */
/* ===================================================================== */

var cv = $("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1, t0 = performance.now();
var CX = 0, CY = 0;   /* the body's centre, shifted left of the roster */
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var nodes = [], particles = [];

function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.max(1, Math.floor(W * DPR));
  cv.height = Math.max(1, Math.floor(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

function statusColour(s, staffed){
  if (!staffed) return null;
  if (s === "running") return "#2ee6a8";
  if (s === "flagged") return "#ffb020";
  if (s === "failed")  return "#ff4d6d";
  return "#4a5a6b";
}

function layout(){
  nodes = [];
  if (!state.data) return;
  var agents = state.data.agents || [];
  var divs = state.data.divisions || [];

  /* The roster occupies the right edge on wide screens, so the body sits left
     of it rather than under it. */
  var usable = Math.min(W * (W > 1100 ? 0.78 : 1), H);
  var cx = (W > 1100 ? (W - Math.min(272, W * 0.26)) / 2 : W / 2);
  var cy = H / 2 + 6;
  CX = cx; CY = cy;
  var R1 = usable * 0.30;
  var R2 = usable * 0.105;

  var gm = null;
  for (var i = 0; i < agents.length; i++) if (agents[i].role === "general_manager") gm = agents[i];
  var dbAud = null;
  for (var j = 0; j < agents.length; j++) if (agents[j].role === "database_auditor") dbAud = agents[j];

  if (gm) nodes.push({ kind:"gm", a:gm, x:cx, y:cy, r:30, accent:"#dfe8f2", parent:null, ang:0 });
  if (dbAud) nodes.push({ kind:"gm", a:dbAud, x:cx, y:cy - R1 * 0.46, r:19, accent:"#8fa6bd", parent:{x:cx,y:cy}, ang:0 });

  for (var d = 0; d < divs.length; d++){
    var ang = (-Math.PI / 2) + (d / Math.max(1, divs.length)) * Math.PI * 2 + 0.55;
    var dx = cx + Math.cos(ang) * R1, dy = cy + Math.sin(ang) * R1;
    /* The division node IS its manager. A manager drawn as one more satellite
       reads as a peer of the workers it directs, which is the wrong shape. */
    var all = agents.filter(function(a){ return a.division_slug === divs[d].slug; });
    var mgr = null;
    for (var q = 0; q < all.length; q++){
      if (all[q].role === "division_manager"){ mgr = all[q]; break; }
    }

    var dn = { kind:"div", div:divs[d], a:mgr, x:dx, y:dy, r:17,
               accent:divs[d].accent || "#7dd3fc", parent:{x:cx,y:cy}, ang:ang };
    nodes.push(dn);

    var mine = all.filter(function(a){ return a !== mgr; });
    /* Seats fan out across the cell's outward face and alternate between two
       radii, so a division with five of them stays legible instead of stacking
       its labels on top of each other. */
    var count = mine.length;
    var spread = Math.min(2.5, 0.85 + count * 0.30);
    for (var k = 0; k < count; k++){
      var frac = count === 1 ? 0.5 : k / (count - 1);
      var sub = ang + (-spread / 2 + frac * spread);
      var role = mine[k].role;
      var rr = role === "division_manager" ? 11.5 : role === "team_auditor" ? 10 : 8.5;
      var ring = R2 * (k % 2 === 0 ? 1 : 1.46);
      nodes.push({
        kind:"agent", a:mine[k],
        x: dx + Math.cos(sub) * ring, y: dy + Math.sin(sub) * ring,
        r: rr, accent: divs[d].accent || "#7dd3fc", parent:{x:dx,y:dy}, ang:sub
      });
    }
  }
}

function filament(ax, ay, bx, by, colour, alpha, width){
  var mx = (ax + bx) / 2, my = (ay + by) / 2;
  var nx = -(by - ay), ny = (bx - ax);
  var len = Math.hypot(nx, ny) || 1;
  var bow = Math.min(34, len * 0.11);
  var qx = mx + (nx / len) * bow, qy = my + (ny / len) * bow;

  var g = ctx.createLinearGradient(ax, ay, bx, by);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.5, colour);
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = g;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.quadraticCurveTo(qx, qy, bx, by);
  ctx.stroke();
  ctx.restore();
  return { qx:qx, qy:qy };
}

function drawOrganism(now){
  ctx.clearRect(0, 0, W, H);
  var t = reduce ? 0 : (now - t0) / 1000;

  /* ambient field — drawn even with no data, so the panel is never a void */
  var cx = CX || (W / 2), cy = CY || (H / 2 + 6);
  for (var ring = 0; ring < 3; ring++){
    var rr = Math.min(W, H) * (0.18 + ring * 0.14) + Math.sin(t * 0.35 + ring) * 4;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(45,70,95,0.16)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  if (!state.data){
    ctx.save();
    ctx.fillStyle = "#3d4c5c";
    ctx.font = "500 13px 'IBM Plex Mono',monospace";
    ctx.textAlign = "center";
    ctx.fillText(state.err ? "no reading" : "reading…", cx, cy);
    ctx.restore();
    return;
  }

  var i, n;

  /* filaments first, so nodes sit on top of them */
  for (i = 0; i < nodes.length; i++){
    n = nodes[i];
    if (!n.parent) continue;
    var staffed = n.kind === "div" ? true : (n.a && n.a.staffed);
    var live = n.kind !== "div" && n.a && n.a.status === "running";
    var col = live ? "rgba(46,230,168,.85)"
            : staffed ? hexA(n.accent, .40)
            : "rgba(61,76,92,.30)";
    filament(n.parent.x, n.parent.y, n.x, n.y, col, 1, live ? 1.8 : 1);
  }

  /* nodes */
  for (i = 0; i < nodes.length; i++){
    n = nodes[i];
    var wob = reduce ? 0 : Math.sin(t * 1.1 + i * 0.7) * 0.9;
    var r = n.r + wob;

    if (n.kind === "div"){
      var mgrA    = n.a;
      var seated  = !!(mgrA && mgrA.staffed);
      var mstatus = mgrA ? mgrA.status : "vacant";
      var pulse   = reduce ? 0 : (Math.sin(t * 0.9 + i) + 1) / 2;

      /* membrane */
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 13 + pulse * 3, 0, Math.PI * 2);
      ctx.strokeStyle = hexA(n.accent, .22);
      ctx.lineWidth = 1;
      ctx.stroke();

      /* a manager mid-run pushes a second ring outward, same language the
         worker nodes use, so "who is working" reads at any level */
      if (mstatus === "running"){
        var mp = reduce ? 0.5 : (Math.sin(t * 2.4 + i) + 1) / 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 20 + mp * 10, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(46,230,168," + (0.45 - mp * 0.38) + ")";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      glow(n.x, n.y, r + 22, hexA(n.accent, seated ? .20 : .10));
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      if (seated){
        ctx.fillStyle = hexA(n.accent, .30);
        ctx.fill();
        ctx.strokeStyle = hexA(n.accent, .95);
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        /* no manager behind this division yet — hollow, like any unfilled seat */
        ctx.strokeStyle = hexA(n.accent, .55);
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      /* the status pip a worker would get, carried on the cell itself */
      var msc = statusColour(mstatus, seated);
      if (msc && mstatus !== "idle"){
        ctx.beginPath();
        ctx.arc(n.x + r * 0.72, n.y - r * 0.72, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = msc;
        ctx.fill();
      }

      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#dfe8f2";
      ctx.font = "600 12px 'Chakra Petch',sans-serif";
      ctx.fillText(String(n.div.name).toUpperCase(), n.x, n.y + r + 27);
      /* who is actually running it */
      ctx.fillStyle = seated ? "#8fa6bd" : "#4a5a6b";
      ctx.font = "400 10px 'Chakra Petch',sans-serif";
      ctx.fillText(mgrA ? mgrA.name : "no manager", n.x, n.y + r + 41);
      ctx.restore();
      continue;
    }

    var a = n.a;
    var sc = statusColour(a.status, a.staffed);

    if (!a.staffed){
      /* An unfilled seat is drawn, labelled and counted. The shape of the
         organisation is the point — you should be able to see what has not
         been built yet, not just what has. */
      var lead = n.kind === "gm";
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.strokeStyle = lead ? "rgba(143,166,189,.85)" : "rgba(61,76,92,.8)";
      ctx.lineWidth = lead ? 1.4 : 1;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      /* a faint interior so the ring reads as a seat rather than a hole */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r - 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20,28,38,.55)";
      ctx.fill();

      ctx.save();
      ctx.fillStyle = lead ? "#7e8fa3" : "#4a5a6b";
      ctx.font = (lead ? "600 11px" : "400 10px") + " 'Chakra Petch',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(a.name, n.x, n.y + n.r + (lead ? 18 : 14));
      ctx.restore();
      continue;
    }

    if (a.status === "running"){
      var p = reduce ? 0.5 : (Math.sin(t * 2.6 + i) + 1) / 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 7 + p * 8, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(46,230,168," + (0.5 - p * 0.42) + ")";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    glow(n.x, n.y, n.r + 15, hexA(sc, .30));
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = sc;
    ctx.fill();

    ctx.save();
    ctx.fillStyle = "#b9c8d8";
    ctx.font = "500 11px 'Chakra Petch',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(a.name, n.x, n.y + n.r + 16);
    ctx.restore();
  }

  /* a running agent sends light back to the nucleus */
  if (!reduce){
    for (i = 0; i < nodes.length; i++){
      n = nodes[i];
      if (n.kind !== "agent" || !n.a || n.a.status !== "running" || !n.parent) continue;
      var ph = ((t * 0.55) + i * 0.33) % 1;
      var px = n.x + (n.parent.x - n.x) * ph;
      var py = n.y + (n.parent.y - n.y) * ph;
      glow(px, py, 9, "rgba(46,230,168,.55)");
    }
  }
}

function glow(x, y, r, colour){
  var g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, r));
  g.addColorStop(0, colour);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, Math.max(1, r), 0, Math.PI * 2);
  ctx.fill();
}

function hexA(hex, a){
  if (!hex) return "rgba(120,140,160," + a + ")";
  var h = String(hex).replace("#", "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var v = parseInt(h, 16);
  if (isNaN(v)) return "rgba(120,140,160," + a + ")";
  return "rgba(" + ((v >> 16) & 255) + "," + ((v >> 8) & 255) + "," + (v & 255) + "," + a + ")";
}

function frame(now){ drawOrganism(now); requestAnimationFrame(frame); }

/* roster beside the organism ------------------------------------------- */
function renderRoster(){
  var box = $("roster");
  clear(box);
  if (!state.data) return;
  var divs = state.data.divisions || [], agents = state.data.agents || [];

  for (var d = 0; d < divs.length; d++){
    var mine = agents.filter(function(a){ return a.division_slug === divs[d].slug; });
    if (!mine.length) continue;
    var staffed = mine.filter(function(a){ return a.staffed; }).length;

    var card = el("div", "rdiv");
    var h = el("h5");
    var sw = el("i"); sw.style.background = divs[d].accent; h.appendChild(sw);
    h.appendChild(txt(el("span"), divs[d].name));
    h.appendChild(txt(el("em"), staffed + "/" + mine.length));
    card.appendChild(h);

    /* manager first, then the rest — the list should read like the chart */
    mine.sort(function(x, y){
      var mx = x.role === "division_manager" ? 0 : 1;
      var my = y.role === "division_manager" ? 0 : 1;
      return mx - my || (x.sort - y.sort) || x.name.localeCompare(y.name);
    });

    for (var k = 0; k < mine.length; k++){
      var a = mine[k];
      var row = el("div", "rrow" + (a.staffed ? "" : " vacant") +
                         (a.role === "division_manager" ? " mgr" : ""));
      var dot = el("i");
      dot.className = !a.staffed ? "vacant"
        : a.status === "running" ? "live"
        : a.status === "flagged" ? "warn"
        : a.status === "failed" ? "crit" : "";
      row.appendChild(dot);
      row.appendChild(txt(el("b"), a.name));
      if (a.tier){
        var tg = el("u", "tier t-" + String(a.tier).toLowerCase());
        txt(tg, a.tier);
        if (a.model_note) tg.title = a.model_note;
        row.appendChild(tg);
      }
      card.appendChild(row);
    }
    box.appendChild(card);
  }
}

function tile(label, value, sub, tone){
  var n = el("div", "tile" + (tone ? " " + tone : ""));
  n.appendChild(txt(el("k"), label));
  n.appendChild(txt(el("v"), value));
  if (sub) n.appendChild(txt(el("s"), sub));

}

function renderMetrics(){
  var box = $("tiles");
  clear(box);
  if (!state.data){
    box.appendChild(txt(el("div", "empty"), state.err ? "No reading from Supabase." : "Reading…"));
    clear($("divbars"));
    return;
  }
  var m = state.data.metrics || {};
  var runs7 = num(m.runs_7d), ok7 = num(m.ok_7d);
  var rate = runs7 ? Math.round(ok7 / runs7 * 100) + "%" : "—";

  box.appendChild(tile("Seats staffed", fmtInt(m.agents_staffed) + " / " + fmtInt(m.agents_total),
    "agents with a routine behind them"));
  box.appendChild(tile("Running now", fmtInt(m.agents_running),
    fmtInt(m.runs_active) + " active session(s)", num(m.agents_running) ? "live" : null));
  box.appendChild(tile("Runs, 24h", fmtInt(m.runs_24h), fmtInt(m.runs_7d) + " over 7 days"));
  box.appendChild(tile("Succeeded, 7d", rate,
    fmtInt(ok7) + " of " + fmtInt(runs7) + (num(m.failed_7d) ? " · " + fmtInt(m.failed_7d) + " failed" : "")));
  box.appendChild(tile("Flagged, 7d", fmtInt(m.flags_7d), "raised by an agent mid-run",
    num(m.flags_7d) ? "warn" : null));
  box.appendChild(tile("Median run", dur(m.avg_seconds_7d), "mean wall time over 7 days"));
  box.appendChild(tile("Files changed, 7d", fmtInt(m.files_changed_7d),
    fmtInt(m.prs_7d) + " pull request(s) opened"));

  drawChart();
  renderDivBars();
}

function drawChart(){
  var c = $("chart");
  if (!c || !state.data) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = c.clientWidth, h = c.clientHeight;
  c.width = Math.max(1, Math.floor(w * dpr));
  c.height = Math.max(1, Math.floor(h * dpr));
  var g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  var days = state.data.byday || [];
  if (!days.length) return;

  var padL = 40, padR = 8, padT = 12, padB = 30;
  var iw = Math.max(1, w - padL - padR), ih = Math.max(1, h - padT - padB);
  var max = 0;
  for (var i = 0; i < days.length; i++) max = Math.max(max, num(days[i].runs));
  /* A flat-zero fleet is the truth today, so the axis says 1 rather than
     inventing a scale the data never reaches. */
  var top = Math.max(1, max);

  /* gridlines, each labelled with a value the chart actually reaches */
  g.font = "500 10px 'IBM Plex Mono',monospace";
  g.textAlign = "right";
  g.textBaseline = "middle";
  var steps = Math.min(4, top);
  for (var s = 0; s <= steps; s++){
    var v = Math.round(top * s / steps);
    var y = padT + ih - (v / top) * ih;
    g.strokeStyle = "rgba(24,34,46,1)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(padL + iw, y); g.stroke();
    g.fillStyle = "#3d4c5c";
    g.fillText(String(v), padL - 9, y);
  }

  var bw = iw / days.length;
  g.textAlign = "center";
  g.textBaseline = "top";
  for (var d = 0; d < days.length; d++){
    var row = days[d];
    var runs = num(row.runs), failed = num(row.failed), okc = runs - failed;
    var x = padL + d * bw + bw * 0.22, bwid = Math.max(3, bw * 0.56);

    if (runs > 0){
      var hOk = (okc / top) * ih, hBad = (failed / top) * ih;
      if (hBad > 0){
        g.fillStyle = "#ff4d6d";
        g.fillRect(x, padT + ih - hBad, bwid, hBad);
      }
      if (hOk > 0){
        g.fillStyle = "#2ee6a8";
        g.fillRect(x, padT + ih - hBad - hOk, bwid, hOk);
      }
    } else {
      g.fillStyle = "rgba(61,76,92,.4)";
      g.fillRect(x, padT + ih - 2, bwid, 2);
    }

    if (d % 2 === 0 || d === days.length - 1){
      g.fillStyle = "#3d4c5c";
      g.fillText(String(row.day).slice(5), padL + d * bw + bw / 2, padT + ih + 9);
    }
  }
}

function renderDivBars(){
  var box = $("divbars");
  clear(box);
  if (!state.data) return;

  var head = el("div");
  head.style.cssText = "font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#6b7e93;margin-bottom:12px";
  txt(head, "Seats staffed by department");
  box.appendChild(head);

  var divs = state.data.divisions || [], agents = state.data.agents || [];
  for (var d = 0; d < divs.length; d++){
    var mine = agents.filter(function(a){ return a.division_slug === divs[d].slug; });
    if (!mine.length) continue;
    var staffed = mine.filter(function(a){ return a.staffed; }).length;
    var pct = Math.round(staffed / mine.length * 100);

    var row = el("div", "dbar");
    row.appendChild(txt(el("em"), divs[d].name));
    var track = el("div", "track");
    var fill = el("div", "fill");
    fill.style.width = Math.max(pct, staffed ? 3 : 0) + "%";
    fill.style.background = divs[d].accent;
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(txt(el("div", "n num"), staffed + " / " + mine.length));
    box.appendChild(row);
  }
}

function renderFlow(){
  var gatesBox = $("gates"), flowBox = $("flow"), flagBox = $("flags");
  clear(gatesBox); clear(flowBox); clear(flagBox);

  if (!state.data){
    gatesBox.appendChild(txt(el("div", "empty"), state.err ? "No reading." : "Reading…"));
    flowBox.appendChild(txt(el("div", "empty"), state.err ? "No reading." : "Reading…"));
    flagBox.appendChild(txt(el("div", "empty"), state.err ? "No reading." : "Reading…"));
    return;
  }

  /* the gates ---------------------------------------------------------- */
  var gates = state.data.gates || [];
  $("ngates").textContent = gates.length;
  if (!gates.length){
    gatesBox.appendChild(txt(el("div", "empty"),
      "Nothing waiting. Work staged by an agent appears here, moves on when its team auditor confirms it, and leaves when the database auditor promotes it."));
  }
  var STATE_LABEL = { staged:"awaiting team audit", team_approved:"awaiting promotion", escalated:"escalated" };
  for (var i = 0; i < gates.length; i++){
    var c = gates[i];
    var card = el("div", "gate " + (c.state || "staged") + (c.risk === "high" ? " high" : ""));
    card.appendChild(txt(el("b"), c.title));
    var meta = el("div", "meta");
    meta.appendChild(txt(el("span"), STATE_LABEL[c.state] || c.state));
    if (c.division_name) meta.appendChild(txt(el("span"), c.division_name));
    if (c.agent_name) meta.appendChild(txt(el("span"), c.agent_name));
    if (c.staging_ref) meta.appendChild(txt(el("span"), c.staging_ref));
    meta.appendChild(txt(el("span"), "waiting " + dur(c.waiting_seconds)));
    card.appendChild(meta);
    gatesBox.appendChild(card);
  }

  /* the stream --------------------------------------------------------- */
  var flow = state.data.flow || [];
  $("nflow").textContent = flow.length;
  if (!flow.length){
    flowBox.appendChild(txt(el("div", "empty"),
      "Quiet. Every start, note, flag and finish an agent reports lands here as it happens."));
  }
  for (var k = 0; k < Math.min(flow.length, 80); k++){
    var e = flow[k];
    var row = el("div", "ev" + (state.seen[e.id] ? "" : " new"));
    state.seen[e.id] = 1;
    row.appendChild(txt(el("time"), ago(e.at) + " ago"));
    var dot = el("i");
    dot.className = e.severity === "critical" || e.kind === "flag" ? "flag"
                  : e.severity === "warn" ? "warn"
                  : e.kind === "start" ? "start" : "finish";
    row.appendChild(dot);
    var body = el("div");
    var who = el("div", "who");
    txt(who, (e.agent_name || e.agent_slug || "fleet") + (e.division_name ? " · " + e.division_name : ""));
    body.appendChild(who);
    body.appendChild(txt(el("div"), e.message));
    row.appendChild(body);
    flowBox.appendChild(row);
  }

  /* flagged ------------------------------------------------------------ */
  var flags = (state.data.flags && state.data.flags.length) ? state.data.flags
            : flow.filter(function(e){ return e.kind === "flag" || e.severity === "critical"; });
  $("nflags").textContent = flags.length;
  if (!flags.length){
    flagBox.appendChild(txt(el("div", "empty"), "Nothing flagged."));
  }
  for (var f = 0; f < flags.length; f++){
    var it = el("div", "flagitem");
    it.appendChild(txt(el("div"), flags[f].message));
    it.appendChild(txt(el("time"),
      (flags[f].agent_name || flags[f].agent_slug || "fleet") + " · " + ago(flags[f].at) + " ago"));
    flagBox.appendChild(it);
  }
}

function showScreen(id){
  current = id;
  for (var i = 0; i < SCREENS.length; i++){
    var on = SCREENS[i].id === id;
    $("s-" + SCREENS[i].id).setAttribute("data-on", on ? "1" : "0");
    var b = document.querySelector('#tabs button[data-s="' + SCREENS[i].id + '"]');
    if (b) b.setAttribute("aria-current", on ? "true" : "false");
  }
  $("legend").style.display = id === "organism" ? "flex" : "none";
  $("roster").style.display = id === "organism" ? "flex" : "none";
  if (id === "organism") sizeCanvas();
  if (id === "metrics") drawChart();

  /* Remembered for this tab first, so each monitor holds its own screen. */
  store("sessionStorage", KEY, id);
  store("localStorage", KEY, id);
}

function buildTabs(){
  var nav = $("tabs");
  clear(nav);
  for (var i = 0; i < SCREENS.length; i++){
    (function(s){
      var b = el("button");
      b.setAttribute("data-s", s.id);
      b.setAttribute("aria-current", s.id === current ? "true" : "false");
      txt(b, s.label);
      b.addEventListener("click", function(){ showScreen(s.id); });
      nav.appendChild(b);
    })(SCREENS[i]);
  }
}

window.addEventListener("resize", function(){
  if (current === "organism") sizeCanvas();
  if (current === "metrics") drawChart();
});

function nextScreen(step){
  var i = IDS.indexOf(current);
  showScreen(SCREENS[(i + step + SCREENS.length) % SCREENS.length].id);
}

/* Rotation, cycled with R: off, 30s, 60s, 120s. Also remembered per tab, so a
   spare monitor can be left cycling while the other two stay put. */
var rotTimer = null;
function applyRotate(){
  if (rotTimer) { clearInterval(rotTimer); rotTimer = null; }
  if (rotateSec >= 5) rotTimer = setInterval(function(){ nextScreen(1); }, rotateSec * 1000);
  $("rot").textContent = rotateSec >= 5 ? ("cycling " + rotateSec + "s") : "";
  store("sessionStorage", KEY_ROT, String(rotateSec));
  store("localStorage", KEY_ROT, String(rotateSec));
}

document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") nextScreen(1);
  if (e.key === "ArrowLeft") nextScreen(-1);
  if (e.key >= "1" && e.key <= String(SCREENS.length)) showScreen(SCREENS[parseInt(e.key, 10) - 1].id);
  if (e.key === "r" || e.key === "R"){
    var steps = [0, 30, 60, 120];
    rotateSec = steps[(steps.indexOf(rotateSec) + 1) % steps.length] || 0;
    applyRotate();
  }
});

buildTabs();
$("back").href = "/c/" + encodeURIComponent(COMPANY);
showScreen(current);
clockTick();
setInterval(clockTick, 15000);
sizeCanvas();
requestAnimationFrame(frame);
renderAll();

applyRotate();

load();
setInterval(load, POLL_MS);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
</script>

</body></html>
